name: CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: yarn

            - name: Install dependencies
              # --ignore-scripts: dependency lifecycle scripts are not needed to
              # build this app and running them would execute third-party code in CI.
              run: yarn install --frozen-lockfile --ignore-scripts

            - name: Lint
              run: yarn lint

            - name: Build
              run: yarn run zip

            - name: Upload bundle
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: app-bundle
                  path: compiled/*.zip
